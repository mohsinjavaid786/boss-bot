name: Prepare product polish
on:
  push:
    branches: [product-polish]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare formatted sources
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs/promises";
          import prettier from "prettier";
          const paths = ["apps/web/src/main.tsx","apps/web/src/style.css","apps/web/src/Connections.tsx","apps/web/src/TaskComposer.tsx","apps/web/src/TaskHistory.tsx","apps/web/src/task-view.ts","apps/server/src/http.ts","apps/server/src/store.ts","packages/core/src/index.ts","tests/task-controls.test.ts","tests/task-view.test.ts","tests/product-ui.mjs","README.md",".github/workflows/product-ui.yml"];
          for (const path of paths) {
            const source = await fs.readFile(path, "utf8");
            const config = await prettier.resolveConfig(path);
            const content = await prettier.format(source, { ...config, filepath: path });
            console.log("FORMATTED_FILE:" + JSON.stringify({path,content}));
          }
          JS
